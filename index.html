    function Icon({ name, className = "w-4 h-4" }) {
      const spanRef = useRef(null);

      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = '';
          const iEl = document.createElement('i');
          iEl.setAttribute('data-lucide', name);
          spanRef.current.appendChild(iEl);
          window.lucide.createIcons({
            icons: { [name]: window.lucide.icons[name] },
            nameAttr: 'data-lucide'
          });
        }
      }, [name]);

    // Helper functions
    function normalizeAnswerStr(str) {
      if (!str) return '';
      return str.trim().replace(/\s+/g, ' ').toLowerCase();
    }

    // Main App Component
    function App() {
      // States
      const [lang, setLang] = useState(() => localStorage.getItem('es_lang') || 'th');
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('es_theme') === 'dark');
      const [currentPage, setCurrentPage] = useState('dashboard'); // dashboard, selection, exam, result, analytics
      
      // Exam Session States
      const [selectedSet, setSelectedSet] = useState('all'); // all, 1, 2, 3, 4
      const [examMode, setExamMode] = useState('practice'); // practice, exam, incorrect, unanswered
      const [activeQuestions, setActiveQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({}); // { qId: { selected: '', isSubmitted: bool, isCorrect: bool, marked: bool } }
      const [timeLeft, setTimeLeft] = useState(0);
      const [timerActive, setTimerActive] = useState(false);
      const [timeSpent, setTimeSpent] = useState(0);

      // Historical Attempts
      const [attempts, setAttempts] = useState(() => {
        const saved = localStorage.getItem('es_attempts');
        return saved ? JSON.parse(saved) : [];
      });

      // Saved active session state
      const [savedSession, setSavedSession] = useState(() => {
        const saved = localStorage.getItem('es_active_session');
        return saved ? JSON.parse(saved) : null;
      });

      const t = i18nDict[lang];

      // Theme toggle effect
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('es_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('es_theme', 'light');
        }
      }, [darkMode]);

      // Save language
      useEffect(() => {
        localStorage.setItem('es_lang', lang);
      }, [lang]);

      // Save attempts
      useEffect(() => {
        localStorage.setItem('es_attempts', JSON.stringify(attempts));
      }, [attempts]);

      // Timer effect for Exam Mode
      useEffect(() => {
        let interval = null;
        if (timerActive && timeLeft > 0) {
          interval = setInterval(() => {
            setTimeLeft(prev => prev - 1);
            setTimeSpent(prev => prev + 1);
          }, 1000);
        } else if (timeLeft === 0 && timerActive) {
          setTimerActive(false);
          finishExamSession();
        }
        return () => clearInterval(interval);
      }, [timerActive, timeLeft]);

      // Initialize Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Global Stats
      const overallStats = useMemo(() => {
        let totalAnswered = 0;
        let totalCorrect = 0;
        
        attempts.forEach(att => {
          totalAnswered += att.answeredCount;
          totalCorrect += att.correctCount;
        });

        const totalAttemptsCount = attempts.length;
        const avgScorePercent = totalAttemptsCount > 0 
          ? Math.round(attempts.reduce((acc, curr) => acc + curr.percentage, 0) / totalAttemptsCount) 
          : 0;

        const accuracyRate = totalAnswered > 0 
          ? Math.round((totalCorrect / totalAnswered) * 100) 
          : 0;

        return {
          totalQuestions: rawExamData.length,
          totalSets: 4,
          totalAnswered,
          avgScorePercent,
          accuracyRate,
          totalAttemptsCount
        };
      }, [attempts]);

      // Handler: Start Exam
      const startExamSession = (setId = selectedSet, mode = examMode, filterQuestions = null) => {
        let qList = [];
        if (filterQuestions) {
          qList = filterQuestions;
        } else if (setId === 'all') {
          qList = [...rawExamData];
        } else {
          qList = rawExamData.filter(q => q.examSetId === Number(setId));
        }

        if (qList.length === 0) {
          alert(lang === 'th' ? 'ไม่มีข้อสอบในเงื่อนไขที่เลือก' : 'No questions matching selected filter');
          return;
        }

        setSelectedSet(setId);
        setExamMode(mode);
        setActiveQuestions(qList);
        setCurrentIndex(0);
        
        // Initial user answers map
        const initialAnswers = {};
        qList.forEach(q => {
          initialAnswers[q.id] = {
            selected: '',
            typed: '',
            isSubmitted: false,
            isCorrect: null,
            marked: false
          };
        });
        setUserAnswers(initialAnswers);

        // Timer setups (2 mins per question in exam mode)
        if (mode === 'exam') {
          setTimeLeft(qList.length * 120);
          setTimerActive(true);
        } else {
          setTimerActive(false);
          setTimeLeft(0);
        }
        setTimeSpent(0);

        setCurrentPage('exam');
      };

      // Handler: Save Session
      const saveActiveSessionState = () => {
        const sessionData = {
          selectedSet,
          examMode,
          activeQuestions,
          currentIndex,
          userAnswers,
          timeLeft,
          timeSpent,
          timestamp: new Date().toISOString()
        };
        setSavedSession(sessionData);
        localStorage.setItem('es_active_session', JSON.stringify(sessionData));
        alert(lang === 'th' ? 'บันทึกความคืบหน้าสำเร็จ!' : 'Progress saved successfully!');
      };

      // Handler: Resume Session
      const resumeSavedSession = () => {
        if (!savedSession) return;
        setSelectedSet(savedSession.selectedSet);
        setExamMode(savedSession.examMode);
        setActiveQuestions(savedSession.activeQuestions);
        setCurrentIndex(savedSession.currentIndex);
        setUserAnswers(savedSession.userAnswers);
        setTimeLeft(savedSession.timeLeft);
        setTimeSpent(savedSession.timeSpent);
        if (savedSession.examMode === 'exam' && savedSession.timeLeft > 0) {
          setTimerActive(true);
        }
        setCurrentPage('exam');
      };

      // Handler: Select Answer Option
      const handleSelectOption = (qId, optionKey) => {
        setUserAnswers(prev => {
          const current = prev[qId];
          if (examMode === 'practice' && current?.isSubmitted) return prev; // Locked after submission in practice
          return {
            ...prev,
            [qId]: {
              ...current,
              selected: optionKey
            }
          };
        });
      };

      // Handler: Type CLI Answer
      const handleTypeAnswer = (qId, text) => {
        setUserAnswers(prev => {
          const current = prev[qId];
          if (examMode === 'practice' && current?.isSubmitted) return prev;
          return {
            ...prev,
            [qId]: {
              ...current,
              typed: text
            }
          };
        });
      };

      // Handler: Submit Answer in Practice Mode
      const handleSubmitAnswer = (q) => {
        const userAns = userAnswers[q.id];
        if (!userAns) return;

        let isCorrect = false;
        if (q.questionType === 'mcq') {
          if (!userAns.selected) return;
          isCorrect = (userAns.selected === q.correctAnswer);
        } else {
          // Short answer / CLI
          const typedNorm = normalizeAnswerStr(userAns.typed);
          const correctNorm = normalizeAnswerStr(q.correctAnswer);
          isCorrect = typedNorm === correctNorm || typedNorm.includes(correctNorm);
        }

        setUserAnswers(prev => ({
          ...prev,
          [q.id]: {
            ...prev[q.id],
            isSubmitted: true,
            isCorrect
          }
        }));
      };

      // Handler: Toggle Mark for Review
      const toggleMarkForReview = (qId) => {
        setUserAnswers(prev => ({
          ...prev,
          [qId]: {
            ...prev[qId],
            marked: !prev[qId]?.marked
          }
        }));
      };

      // Handler: Clear Answer
      const clearAnswer = (q) => {
        const userAns = userAnswers[q.id];
        if (examMode === 'practice' && userAns?.isSubmitted) return;
        setUserAnswers(prev => ({
          ...prev,
          [q.id]: {
            ...prev[q.id],
            selected: '',
            typed: '',
            isSubmitted: false,
            isCorrect: null
          }
        }));
      };

      // Handler: Finish Exam Session
      const finishExamSession = () => {
        setTimerActive(false);
        
        let correctCount = 0;
        let incorrectCount = 0;
        let unansweredCount = 0;

        activeQuestions.forEach(q => {
          const uAns = userAnswers[q.id];
          let isCorr = false;

          if (q.questionType === 'mcq') {
            if (!uAns || !uAns.selected) {
              unansweredCount++;
            } else if (uAns.selected === q.correctAnswer) {
              correctCount++;
              isCorr = true;
            } else {
              incorrectCount++;
            }
          } else {
            if (!uAns || !uAns.typed || uAns.typed.trim() === '') {
              unansweredCount++;
            } else {
              const typedNorm = normalizeAnswerStr(uAns.typed);
              const correctNorm = normalizeAnswerStr(q.correctAnswer);
              if (typedNorm === correctNorm || typedNorm.includes(correctNorm)) {
                correctCount++;
                isCorr = true;
              } else {
                incorrectCount++;
              }
            }
          }
        });

        const totalQ = activeQuestions.length;
        const percentage = totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0;

        const attemptRecord = {
          id: 'att_' + Date.now(),
          setId: selectedSet,
          mode: examMode,
          timestamp: new Date().toLocaleDateString(lang === 'th' ? 'th-TH' : 'en-US', {
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          }),
          totalQuestions: totalQ,
          correctCount,
          incorrectCount,
          unansweredCount,
          percentage,
          timeSpent,
          userAnswersState: userAnswers,
          questions: activeQuestions

        setAttempts(prev => [attemptRecord, ...prev]);
        setSavedSession(null);
        localStorage.removeItem('es_active_session');
        setCurrentPage('result');

      const exportResultsCSV = () => {

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Attempt ID,Date,Set,Mode,Total Questions,Correct,Incorrect,Unanswered,Percentage (%),Time Spent (s)\n";

        attempts.forEach(a => {
          csvContent += `${a.id},"${a.timestamp}",Set ${a.setId},${a.mode},${a.totalQuestions},${a.correctCount},${a.incorrectCount},${a.unansweredCount},${a.percentage},${a.timeSpent}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Exam_Space_Results_${Date.now()}.csv`);

        link.click();

                    <p className="text-sm opacity-70 max-w-2xl">

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                  
                  {/* Total Questions */}

                          onClick={() => setExamMode('exam')}
                          className={`p-5 rounded-2xl cursor-pointer transition-all space-y-2 ${
                            examMode === 'exam' ? neuInsetClass + ' border border-blue-500/40' : neuCardClass
                          }`}
                        >
                          <div className="flex justify-between items-center">
                            <h4 className="font-bold text-base flex items-center gap-2">
                              <Icon name="clock" className="w-5 h-5 text-amber-500" />
                              {t.examMode}
                            </h4>
                            {examMode === 'exam' && <Icon name="check-circle-2" className="w-5 h-5 text-blue-500" />}
                          </div>
                          <p className="text-xs opacity-70">
                            {lang === 'th' 
                              ? 'จำลองการสอบจริง มีตัวนับเวลา ซ่อนเฉลยจนกว่าจะส่งข้อสอบเสร็จ' 
                              : 'Simulates official exam with countdown timer and hides answers until final submission.'}
                          </p>
                        </div>

                      </div>
                    </div>

                    {/* Quick Filters */}
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider mb-3 opacity-80">
                        3. {lang === 'th' ? 'โหมดพิเศษ (ตัวกรองเฉพาะ)' : 'Special Question Filters'}
                      </label>
                      <div className="flex flex-wrap gap-3">
                        <button
                          onClick={() => {
                            const incorrectIds = new Set();
                            attempts.forEach(att => {
                              Object.keys(att.userAnswersState).forEach(qId => {
                                if (att.userAnswersState[qId].isCorrect === false) {
                                  incorrectIds.add(qId);
                                }
                              });
                            });
                            const filterQs = rawExamData.filter(q => incorrectIds.has(q.id));
                            if (filterQs.length === 0) {
                              alert(lang === 'th' ? 'ไม่พบข้อสอบที่เคยตอบผิด' : 'No previously missed questions found.');
                              return;
                            }
                            startExamSession('all', 'practice', filterQs);
                          }}
                          className={`${neuButtonClass} px-4 py-3 flex items-center gap-2 text-rose-500`}
                        >
                          <Icon name="x-circle" />
                          <span>{t.incorrectOnly}</span>
                        </button>
                      </div>
                    </div>

                    {/* Launch Button */}
                    <div className="pt-4 flex justify-end">
                      <button
                        onClick={() => startExamSession(selectedSet, examMode)}
                        className={`${neuButtonClass} bg-blue-600 text-white dark:text-white px-8 py-3.5 text-base font-bold flex items-center gap-2 border-0`}
                      >
                        <Icon name="play" className="w-5 h-5" />
                        <span>{t.startPractice}</span>
                      </button>
                    </div>

                  </div>
                </div>

              </div>
            )}

            {/* PAGE C: EXAM INTERFACE */}
            {currentPage === 'exam' && activeQuestions.length > 0 && (
              <div className="space-y-6 animate-fadeIn max-w-4xl mx-auto">
                
                {/* Top Control Bar */}
                <div className={`${neuCardClass} flex flex-col sm:flex-row justify-between items-center gap-4 py-4`}>
                  <div className="flex items-center gap-3">
                    <span className="px-3 py-1 rounded-full bg-blue-500/10 text-blue-500 text-xs font-bold">
                      {selectedSet === 'all' ? t.allSets : `SET 0${selectedSet}`}
                    </span>
                    <span className="text-sm font-semibold">
                      {t.question} {currentIndex + 1} / {activeQuestions.length}
                    </span>
                  </div>

                  {/* Timer if exam mode */}
                  {examMode === 'exam' && (
                    <div className={`px-4 py-2 rounded-xl flex items-center gap-2 font-mono font-bold text-amber-500 ${neuInsetClass}`}>
                      <Icon name="clock" />
                      <span>
                        {Math.floor(timeLeft / 60).toString().padStart(2, '0')}:{(timeLeft % 60).toString().padStart(2, '0')}
                      </span>
                    </div>
                  )}

                  <div className="flex items-center gap-2">
                    <button
                      onClick={saveActiveSessionState}
                      className={`${neuButtonClass} px-3 py-1.5 text-xs flex items-center gap-1.5`}
                      title="Save progress to continue later"
                    >
                      <Icon name="save" className="w-3.5 h-3.5" />
                      <span>{lang === 'th' ? 'บันทึก' : 'Save'}</span>
                    </button>

                    <button
                      onClick={() => toggleMarkForReview(activeQuestions[currentIndex].id)}
                      className={`${neuButtonClass} px-3 py-1.5 text-xs flex items-center gap-1.5 ${
                        userAnswers[activeQuestions[currentIndex].id]?.marked ? 'text-amber-500 font-bold' : ''
                      }`}
                    >
                      <Icon name="bookmark" className="w-3.5 h-3.5" />
                      <span>{t.markReview}</span>
                    </button>
                  </div>
                </div>

                {/* Progress Bar */}
                <div className={`w-full h-2 rounded-full overflow-hidden ${neuInsetClass}`}>
                  <div 
                    className="h-full bg-blue-500 transition-all duration-300"
                    style={{ width: `${((currentIndex + 1) / activeQuestions.length) * 100}%` }}
                  ></div>
                </div>

                {/* Question Card */}
                {(() => {
                  const q = activeQuestions[currentIndex];
                  const qTranslation = q.translations[lang] || q.translations['en'];
                  const uAns = userAnswers[q.id] || { selected: '', typed: '', isSubmitted: false, isCorrect: null };

                  return (
                    <div className={neuCardClass + " space-y-6"}>
                      
                      {/* Topic Tag & Type */}
                      <div className="flex justify-between items-center text-xs opacity-70">
                        <span className="font-semibold uppercase tracking-wider text-blue-500">
                          {q.topic}
                        </span>
                        <span className="font-mono">
                          {q.questionType === 'mcq' ? 'Multiple Choice' : 'Short Answer / CLI'}
                        </span>
                      </div>

                      {/* Question Text */}
                      <h3 className="text-lg sm:text-xl font-bold leading-relaxed">
                        {qTranslation.questionText}
                      </h3>

                      {/* Multiple Choice Options */}
                      {q.questionType === 'mcq' && (
                        <div className="space-y-3 pt-2">
                          {['A', 'B', 'C', 'D'].map((optionKey, idx) => {
                            const optionText = qTranslation.options[idx];
                            const isSelected = uAns.selected === optionKey;
                            
                            let styleClass = neuCardClass;
                            if (examMode === 'practice' && uAns.isSubmitted) {
                              if (optionKey === q.correctAnswer) {
                                styleClass = `${neuInsetClass} border-2 border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold`;
                              } else if (isSelected && !uAns.isCorrect) {
                                styleClass = `${neuInsetClass} border-2 border-rose-500 bg-rose-500/10 text-rose-600 dark:text-rose-400 font-semibold`;
                              }
                            } else if (isSelected) {
                              styleClass = `${neuInsetClass} border-2 border-blue-500 text-blue-500 font-semibold`;
                            }

                            return (
                              <div
                                key={optionKey}
                                onClick={() => handleSelectOption(q.id, optionKey)}
                                className={`p-4 rounded-xl cursor-pointer transition-all flex items-start gap-4 ${styleClass}`}
                              >
                                <div className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${
                                  isSelected ? 'bg-blue-500 text-white' : neuInsetClass
                                }`}>
                                  {optionKey}
                                </div>
                                <div className="text-sm sm:text-base leading-snug pt-0.5">
                                  {optionText}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {/* Short Answer / CLI Command Box */}
                      {q.questionType === 'short' && (
                        <div className="space-y-3 pt-2">
                          <textarea
                            value={uAns.typed || ''}
                            onChange={(e) => handleTypeAnswer(q.id, e.target.value)}
                            disabled={examMode === 'practice' && uAns.isSubmitted}
                            placeholder={t.enterCliAnswer}
                            rows="3"
                            className={`w-full p-4 text-sm font-mono rounded-xl outline-none transition-all ${neuInsetClass}`}
                          ></textarea>

                          {examMode === 'practice' && uAns.isSubmitted && (
                            <div className="p-3 rounded-xl bg-gray-500/10 text-xs font-mono">
                              <span className="font-bold opacity-70">{t.correctAnswerStr}: </span>
                              <span className="text-emerald-500 font-bold">{q.correctAnswer}</span>
                            </div>
                          )}
                        </div>
                      )}

                      {/* Practice Mode Feedback Box */}
                      {examMode === 'practice' && uAns.isSubmitted && (
                        <div className={`p-5 rounded-xl space-y-2 border ${
                          uAns.isCorrect ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-rose-500/10 border-rose-500/30'
                        }`}>
                          <div className="flex items-center gap-2 font-bold text-sm">
                            <Icon name={uAns.isCorrect ? "check-circle" : "x-circle"} className={`w-5 h-5 ${uAns.isCorrect ? 'text-emerald-500' : 'text-rose-500'}`} />
                            <span className={uAns.isCorrect ? 'text-emerald-500' : 'text-rose-500'}>
                              {uAns.isCorrect ? t.correct : t.incorrect}
                            </span>
                          </div>
                          <p className="text-xs sm:text-sm opacity-90 leading-relaxed pt-1">
                            <strong className="block mb-1">{t.explanation}:</strong>
                            {qTranslation.explanation}
                          </p>
                        </div>
                      )}

                      {/* Action Bar */}
                      <div className="pt-4 flex flex-wrap items-center justify-between gap-3 border-t border-gray-500/10">
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => clearAnswer(q)}
                            className={`${neuButtonClass} px-3 py-2 text-xs text-gray-500`}
                          >
                            {t.clearAnswer}
                          </button>
                        </div>

                        <div className="flex items-center gap-3">
                          {examMode === 'practice' && !uAns.isSubmitted && (
                            <button
                              onClick={() => handleSubmitAnswer(q)}
                              className={`${neuButtonClass} bg-emerald-600 text-white dark:text-white px-5 py-2 font-bold border-0`}
                            >
                              {t.submitAnswer}
                            </button>
                          )}

                          <button
                            disabled={currentIndex === 0}
                            onClick={() => setCurrentIndex(prev => prev - 1)}
                            className={`${neuButtonClass} px-4 py-2 flex items-center gap-1.5 ${currentIndex === 0 ? 'opacity-40 cursor-not-allowed' : ''}`}
                          >
                            <Icon name="chevron-left" />
                            <span>{t.prev}</span>
                          </button>

                          {currentIndex < activeQuestions.length - 1 ? (
                            <button
                              onClick={() => setCurrentIndex(prev => prev + 1)}
                              className={`${neuButtonClass} px-4 py-2 flex items-center gap-1.5`}
                            >
                              <span>{t.next}</span>
                              <Icon name="chevron-right" />
                            </button>
                          ) : (
                            <button
                              onClick={finishExamSession}
                              className={`${neuButtonClass} bg-blue-600 text-white dark:text-white px-6 py-2 font-bold border-0`}
                            >
                              {t.finishExam}
                            </button>
                          )}
                        </div>
                      </div>

                    </div>
                  );
                })()}

                {/* Quick Question Navigation Matrix */}
                <div className={neuCardClass}>
                  <h4 className="text-xs font-bold uppercase tracking-wider mb-3 opacity-70">
                    {lang === 'th' ? 'การนำทางข้อสอบทั้งหมด' : 'Question Quick Grid'}
                  </h4>
                  <div className="flex flex-wrap gap-2">
                    {activeQuestions.map((q, idx) => {
                      const uAns = userAnswers[q.id];
                      let btnStyle = neuButtonClass;
                      
                      if (idx === currentIndex) {
                        btnStyle = `${neuInsetClass} border-2 border-blue-500 text-blue-500 font-bold`;
                      } else if (uAns?.marked) {
                        btnStyle = `${neuButtonClass} text-amber-500 font-bold`;
                      } else if (uAns?.selected || uAns?.typed) {
                        btnStyle = `${neuInsetClass} opacity-80`;
                      }

                      return (
                        <button
                          key={q.id}
                          onClick={() => setCurrentIndex(idx)}
                          className={`w-9 h-9 text-xs flex items-center justify-center font-mono ${btnStyle}`}
                        >
                          {idx + 1}
                        </button>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

            {/* PAGE D: RESULT AND REVIEW */}
            {currentPage === 'result' && attempts.length > 0 && (
              <div className="space-y-8 animate-fadeIn max-w-4xl mx-auto">
                
                {(() => {
                  const latest = attempts[0];
                  
                  return (
                    <>
                      {/* Performance Header Card */}
                      <div className={neuCardClass + " text-center space-y-4 py-8"}>
                        <div className="inline-flex p-4 rounded-full bg-blue-500/10 text-blue-500 mb-2">
                          <Icon name="trophy" className="w-12 h-12" />
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-extrabold">{t.summaryTitle}</h2>
                        <p className="text-xs opacity-60">{latest.timestamp} • Mode: {latest.mode.toUpperCase()}</p>

                        {/* Score Circle / Large stat */}
                        <div className="py-4">
                          <div className="text-5xl sm:text-6xl font-black text-blue-500 tracking-tight">
                            {latest.percentage}%
                          </div>
                          <p className="text-sm opacity-70 font-medium mt-1">
                            {latest.correctCount} {t.of} {latest.totalQuestions} {lang === 'th' ? 'ข้อที่ตอบถูก' : 'Questions Correct'}
                          </p>
                        </div>

                        {/* Breakdown pills */}
                        <div className="grid grid-cols-3 gap-3 max-w-md mx-auto text-xs font-semibold">
                          <div className={`p-3 rounded-xl ${neuInsetClass} text-emerald-500`}>
                            {t.correctCount}: {latest.correctCount}
                          </div>
                          <div className={`p-3 rounded-xl ${neuInsetClass} text-rose-500`}>
                            {t.incorrectCount}: {latest.incorrectCount}
                          </div>
                          <div className={`p-3 rounded-xl ${neuInsetClass} text-gray-400`}>
                            {t.unansweredCount}: {latest.unansweredCount}
                          </div>
                        </div>

                        {/* Buttons */}
                        <div className="pt-6 flex flex-wrap justify-center gap-3">
                          <button
                            onClick={() => startExamSession(latest.setId, latest.mode)}
                            className={`${neuButtonClass} px-5 py-2.5 flex items-center gap-2`}
                          >
                            <Icon name="rotate-ccw" />
                            <span>{t.retake}</span>
                          </button>

                          <button
                            onClick={exportResultsCSV}
                            className={`${neuButtonClass} bg-blue-600 text-white dark:text-white px-5 py-2.5 font-bold flex items-center gap-2 border-0`}
                          >
                            <Icon name="download" />
                            <span>{t.exportCsv}</span>
                          </button>

                          <button
                            onClick={() => setCurrentPage('dashboard')}
                            className={`${neuButtonClass} px-5 py-2.5 flex items-center gap-2`}
                          >
                            <Icon name="home" />
                            <span>{t.backToDash}</span>
                          </button>
                        </div>
                      </div>

                      {/* Detailed Question-by-Question Review */}
                      <div className="space-y-4">
                        <h3 className="text-lg font-bold">{t.reviewAnswers}</h3>

                        {latest.questions.map((q, idx) => {
                          const qTrans = q.translations[lang] || q.translations['en'];
                          const uState = latest.userAnswersState[q.id] || {};
                          
                          let isCorr = false;
                          if (q.questionType === 'mcq') {
                            isCorr = uState.selected === q.correctAnswer;
                          } else {
                            const typedNorm = normalizeAnswerStr(uState.typed);
                            const correctNorm = normalizeAnswerStr(q.correctAnswer);
                            isCorr = typedNorm === correctNorm || typedNorm.includes(correctNorm);
                          }

                          return (
                            <div key={q.id} className={neuCardClass + " space-y-3 text-sm"}>
                              <div className="flex justify-between items-center">
                                <span className="font-bold opacity-70">Q{idx + 1}. {q.topic}</span>
                                <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${
                                  isCorr ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'
                                }`}>
                                  {isCorr ? t.correct : t.incorrect}
                                </span>
                              </div>

                              <p className="font-semibold text-base">{qTrans.questionText}</p>

                              <div className="p-3 rounded-xl bg-gray-500/5 space-y-1 text-xs">
                                <div>
                                  <span className="opacity-60">{t.yourAnswer}: </span>
                                  <span className="font-mono font-bold">
                                    {q.questionType === 'mcq' ? (uState.selected || '-') : (uState.typed || '-')}
                                  </span>
                                </div>
                                <div>
                                  <span className="opacity-60">{t.correctAnswerStr}: </span>
                                  <span className="font-mono font-bold text-emerald-500">{q.correctAnswer}</span>
                                </div>
                              </div>

                              <p className="text-xs opacity-80 leading-relaxed pt-1">
                                <strong>{t.explanation}: </strong> {qTrans.explanation}
                              </p>
                            </div>
                          );
                        })}
                      </div>
                    </>
                  );
                })()}

              </div>
            )}

            {/* PAGE E: STATISTICS DASHBOARD & ANALYTICS */}
            {currentPage === 'analytics' && (
              <div className="space-y-8 animate-fadeIn max-w-5xl mx-auto">
                
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold tracking-tight">{t.analytics}</h2>
                    <p className="text-xs opacity-60">{lang === 'th' ? 'รายงานการทำข้อสอบเชิงลึก' : 'Performance trends and topics analytics'}</p>
                  </div>

                  <button
                    onClick={exportResultsCSV}
                    className={`${neuButtonClass} px-4 py-2 flex items-center gap-2 text-xs font-bold`}
                  >
                    <Icon name="download" />
                    <span>{t.exportCsv}</span>
                  </button>
                </div>

                {/* Overall Summary Grid */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className={neuCardClass}>
                    <p className="text-xs opacity-60">{lang === 'th' ? 'จำนวนรอบที่สอบ' : 'Attempts'}</p>
                    <div className="text-2xl font-bold mt-1">{attempts.length}</div>
                  </div>
                  <div className={neuCardClass}>
                    <p className="text-xs opacity-60">{t.avgScore}</p>
                    <div className="text-2xl font-bold mt-1 text-blue-500">{overallStats.avgScorePercent}%</div>
                  </div>
                  <div className={neuCardClass}>
                    <p className="text-xs opacity-60">{t.accuracyRate}</p>
                    <div className="text-2xl font-bold mt-1 text-emerald-500">{overallStats.accuracyRate}%</div>
                  </div>
                  <div className={neuCardClass}>
                    <p className="text-xs opacity-60">{t.answeredCount}</p>
                    <div className="text-2xl font-bold mt-1">{overallStats.totalAnswered}</div>
                  </div>
                </div>

                {/* Attempts History Table */}
                <div className={neuCardClass + " space-y-4"}>
                  <h3 className="font-bold text-base">{t.history}</h3>

                  {attempts.length === 0 ? (
                    <p className="text-xs opacity-50 text-center py-6">
                      {lang === 'th' ? 'ยังไม่มีประวัติการทำข้อสอบ' : 'No attempt history recorded yet.'}
                    </p>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="border-b border-gray-500/10 opacity-70">
                            <th className="p-3">Date</th>
                            <th className="p-3">Set</th>
                            <th className="p-3">Mode</th>
                            <th className="p-3">Score</th>
                            <th className="p-3">Accuracy</th>
                          </tr>
                        </thead>
                        <tbody>
                          {attempts.map(att => (
                            <tr key={att.id} className="border-b border-gray-500/5 hover:bg-gray-500/5">
                              <td className="p-3">{att.timestamp}</td>
                              <td className="p-3">Set {att.setId}</td>
                              <td className="p-3 uppercase font-semibold">{att.mode}</td>
                              <td className="p-3 font-bold">{att.correctCount}/{att.totalQuestions}</td>
                              <td className="p-3 font-bold text-blue-500">{att.percentage}%</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="py-6 text-center text-xs opacity-50 border-t border-gray-500/10 mt-auto">
            <p>EXAM SPACE • Bilingual Practice Web App • Mobile Engineering Course 2026</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
